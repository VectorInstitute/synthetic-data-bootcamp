# @package judge
# Shared defaults; hardware/cpu.yaml and hardware/gpu_l4.yaml override model size.
threshold: 8.5
backend: qwen_vl          # qwen_vl | clip (CLIP is a light CPU fallback)
model_id: Qwen/Qwen2.5-VL-3B-Instruct
torch_dtype: float32
max_new_tokens: 320
# Visual token budget (Qwen2.5-VL uses 28×28 patches).
min_pixels: 200704        # 256 * 28 * 28
max_pixels: 401408        # 512 * 28 * 28
# Decision bands relative to threshold:
#   overall >= threshold and edge_case_present → accept
#   overall < threshold - reject_margin → reject
#   otherwise → retry
reject_margin: 2.0
