# @package _global_
# Laptop / CPU — deltas only (rest comes from */default.yaml).
hardware:
  name: cpu
  device: null

conditioning:
  depth:
    model_id: depth-anything/Depth-Anything-V2-Base-hf
  segmentation:
    model_name: nvidia/segformer-b0-finetuned-ade-512-512

generation:
  family: sd15
  default_anomaly_method: controlnet
  base_model_id: runwayml/stable-diffusion-v1-5
  inpaint_model_id: null
  controlnet:
    depth: lllyasviel/sd-controlnet-depth
  controlnet_scale:
    depth: 0.50
  num_inference_steps: 20
  strength: 0.72
  max_side: 512

annotation:
  detector_model: google/owlvit-base-patch32
  sam_model: mobile_sam.pt
  conf: 0.015

judge:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  torch_dtype: float32
  threshold: 8.0
  max_pixels: 401408
