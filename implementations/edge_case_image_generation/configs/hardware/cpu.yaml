# @package _global_
# Laptop / CPU — deltas only (rest comes from */default.yaml).
hardware:
  name: cpu
  device: null

conditioning:
  depth:
    model_id: depth-anything/Depth-Anything-V2-Base-hf
  segmentation:
    model_name: nvidia/segformer-b2-finetuned-ade-512-512

generation:
  family: sd15
  default_anomaly_method: inpaint
  base_model_id: runwayml/stable-diffusion-v1-5
  inpaint_model_id: runwayml/stable-diffusion-inpainting
  instruct_model_id: timbrooks/instruct-pix2pix
  controlnet:
    depth: lllyasviel/sd-controlnet-depth
    seg: lllyasviel/sd-controlnet-seg
  controlnet_scale:
    depth: 0.75
    seg: 0.45
  controlnet_strength: 0.38
  instruct_image_guidance: 2.0
  instruct_guidance_scale: 7.0
  num_inference_steps: 28
  guidance_scale: 7.5
  strength: 0.90
  max_side: 512
  padding_mask_crop: 64

annotation:
  detector_model: google/owlvit-base-patch32
  sam_model: mobile_sam.pt
  conf: 0.015

judge:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  torch_dtype: float32
  threshold: 8.0
  max_pixels: 401408
