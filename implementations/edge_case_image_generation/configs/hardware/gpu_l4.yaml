# @package _global_
# g2-standard-8 / 1× NVIDIA L4 — deltas only.
#
# Workshop edit recipe stays on SD 1.5 (inpaint + dual ControlNet + instruct).
# SDXL looked sharper in demos but rewrote scenes; SD1.5 is the trustworthy path.
# L4 still speeds diffusion and hosts larger depth / judge models.
hardware:
  name: gpu_l4
  device: cuda

conditioning:
  depth:
    model_id: depth-anything/Depth-Anything-V2-Large-hf
  segmentation:
    model_name: nvidia/segformer-b3-finetuned-ade-512-512

generation:
  family: sd15
  default_anomaly_method: inpaint
  base_model_id: runwayml/stable-diffusion-v1-5
  inpaint_model_id: runwayml/stable-diffusion-inpainting
  instruct_model_id: timbrooks/instruct-pix2pix
  instruct_image_guidance: 2.0
  instruct_guidance_scale: 7.0
  vae_id: null
  controlnet:
    depth: lllyasviel/sd-controlnet-depth
    seg: lllyasviel/sd-controlnet-seg
  controlnet_scale:
    depth: 0.75
    seg: 0.45
  controlnet_strength: 0.38
  num_inference_steps: 28
  guidance_scale: 7.5
  strength: 0.90
  max_side: 640
  # Crop-to-mask inpaint (diffusers) — critical for small objects like cones.
  padding_mask_crop: 64

annotation:
  detector_model: google/owlvit-large-patch14
  sam_model: sam_b.pt
  conf: 0.02
  max_detections: 25

judge:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  threshold: 8.5
  max_pixels: 1003520
