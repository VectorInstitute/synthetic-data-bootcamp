# @package _global_
# g2-standard-8 / 1× NVIDIA L4 — deltas only.
#
# Local inserts + instruct: FLUX.2-klein-4B (Apache 2.0, ~8–13GB).
# ControlNet depth+seg stays on SD 1.5 (no Klein ControlNet twin).
# Unload between methods — Klein + dual CN do not share the L4.
hardware:
  name: gpu_l4
  device: cuda

conditioning:
  depth:
    model_id: depth-anything/Depth-Anything-V2-Large-hf
  segmentation:
    model_name: nvidia/segformer-b3-finetuned-ade-512-512

generation:
  family: sd15
  default_anomaly_method: inpaint
  base_model_id: runwayml/stable-diffusion-v1-5
  inpaint_model_id: black-forest-labs/FLUX.2-klein-4B
  instruct_model_id: black-forest-labs/FLUX.2-klein-4B
  # Distilled Klein: guidance ignored when >1; 4-step schedule.
  inpaint_num_inference_steps: 4
  inpaint_guidance_scale: 1.0
  instruct_guidance_scale: 1.0
  instruct_num_inference_steps: 4
  instruct_image_guidance: 2.2
  vae_id: null
  controlnet:
    depth: lllyasviel/sd-controlnet-depth
    seg: lllyasviel/sd-controlnet-seg
  controlnet_scale:
    depth: 0.75
    seg: 0.45
  controlnet_strength: 0.38
  # Shared steps/guidance apply to SD ControlNet only; Klein uses knobs above.
  num_inference_steps: 40
  guidance_scale: 8.0
  strength: 1.0
  max_side: 640
  padding_mask_crop: 128

annotation:
  detector_model: google/owlvit-large-patch14
  sam_model: sam_b.pt
  conf: 0.02
  max_detections: 25

judge:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  threshold: 8.5
  max_pixels: 1003520
