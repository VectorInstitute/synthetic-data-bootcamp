# @package _global_
# g2-standard-8 / 1× NVIDIA L4 — deltas only.
hardware:
  name: gpu_l4
  device: cuda

conditioning:
  depth:
    model_id: depth-anything/Depth-Anything-V2-Large-hf
  segmentation:
    # SegFormer (no scipy). Mask2Former also works on L4 but needs `scipy` installed.
    model_name: nvidia/segformer-b3-finetuned-ade-512-512

generation:
  family: sdxl
  default_anomaly_method: inpaint
  base_model_id: stabilityai/stable-diffusion-xl-base-1.0
  inpaint_model_id: diffusers/stable-diffusion-xl-1.0-inpainting-0.1
  # SD1.5 InstructPix2Pix is more reliable than the SDXL twin for photo edits.
  instruct_model_id: timbrooks/instruct-pix2pix
  instruct_image_guidance: 1.6
  instruct_guidance_scale: 7.5
  vae_id: madebyollin/sdxl-vae-fp16-fix
  controlnet:
    depth: diffusers/controlnet-depth-sdxl-1.0
    # No official ADE-seg ControlNet for SDXL; Canny on the seg map carries region structure.
    seg: diffusers/controlnet-canny-sdxl-1.0
  controlnet_scale:
    depth: 0.85
    seg: 0.35
  controlnet_strength: 0.32
  num_inference_steps: 30
  guidance_scale: 5.5
  strength: 0.96
  max_side: 768

annotation:
  detector_model: google/owlvit-large-patch14
  sam_model: sam_b.pt
  conf: 0.02
  max_detections: 25

judge:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  threshold: 8.5
  max_pixels: 1003520
