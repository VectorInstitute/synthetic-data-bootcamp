# @package generation
family: sd15
default_anomaly_method: inpaint
base_model_id: runwayml/stable-diffusion-v1-5
inpaint_model_id: runwayml/stable-diffusion-inpainting
instruct_model_id: timbrooks/instruct-pix2pix
# High image guidance keeps InstructPix2Pix from restyling the whole frame.
instruct_image_guidance: 1.9
instruct_guidance_scale: 6.5
vae_id: null
controlnet:
  depth: lllyasviel/sd-controlnet-depth
  seg: lllyasviel/sd-controlnet-seg
# Dual ControlNet: lock geometry hard; keep img2img denoise low (separate from inpaint strength).
controlnet_scale:
  depth: 0.75
  seg: 0.45
controlnet_strength: 0.38
num_inference_steps: 28
guidance_scale: 7.5
# Inpaint denoise only — do NOT reuse this for ControlNet img2img.
strength: 0.90
# Diffusers inpaint: crop to mask + padding, generate, paste back (helps small objects).
padding_mask_crop: 64
seed: 42
max_side: 512
anomaly_dataset: mapillary_vistas
workshop_anomalies:
  - pothole
  - traffic_cone
  - fog
