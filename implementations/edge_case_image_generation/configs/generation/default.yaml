# @package generation
# Shared generation settings. Hardware profiles override models / sizes / methods.
# Anomaly YAMLs: configs/generation/anomalies/<dataset>/<anomaly>.yaml
family: sd15
default_anomaly_method: paste
base_model_id: runwayml/stable-diffusion-v1-5
inpaint_model_id: null
controlnet:
  depth: lllyasviel/sd-controlnet-depth
  seg: lllyasviel/sd-controlnet-seg
  use_seg: false
controlnet_scale:
  depth: 0.50
  seg: 0.35
num_inference_steps: 16
guidance_scale: 7.5
strength: 0.78
seed: 42
max_side: 512
retries: 3
anomaly_dataset: railsem19
workshop_anomalies:
  - traffic_cone
  - fallen_branch
  - deer_on_track
  - dog_on_track
