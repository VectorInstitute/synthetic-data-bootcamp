# @package generation
# Shared defaults. hardware/*.yaml overrides only the deltas that change per machine.
family: sd15
default_anomaly_method: controlnet
base_model_id: runwayml/stable-diffusion-v1-5
inpaint_model_id: null
vae_id: null
controlnet:
  depth: lllyasviel/sd-controlnet-depth
controlnet_scale:
  depth: 0.55
num_inference_steps: 20
guidance_scale: 7.5
strength: 0.72
seed: 42
max_side: 512
anomaly_dataset: neu_det
workshop_anomalies:
  - extra_scratch
  - crazing_burst
  - patch_blemish
