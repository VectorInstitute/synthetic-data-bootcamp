# RailSem19 — dog on the near track.
id: dog_on_track
dataset: railsem19
display_name: Dog on track
method: auto
prompt: >-
  photorealistic medium dog standing on railway ballast beside the rails,
  stray dog on train tracks, clear four-legged animal, same lighting
negative_prompt: >-
  blurry blob, deformed animal, extra limbs, floating animal, pack of dogs,
  snow, night, cartoon, text, watermark, logo
edit_mask:
  mode: blob
  y_start: 0.60
  y_end: 0.88
  x_center: 0.44
  x_radius: 0.07
  y_radius: 0.10
  intersect_track: false
  blur_sigma: 1.5
  composite_blur: 1.2
prime:
  shape: dog
  color: [110, 90, 70]
strength: 0.82
annotation_classes:
  - dog
  - animal on railway track
  - railway track
  - train
  - sky
  - tree
