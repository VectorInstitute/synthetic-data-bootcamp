# Cab-view animal insert — placement is dynamic (depth + track corridor).
id: dog_on_track
dataset: railsem19
display_name: Dog on track
method: auto
prompt: >-
  photorealistic medium dog standing on railway ballast beside the rails,
  stray dog on train tracks, clear four-legged animal, matching scene
  lighting and motion blur, same camera angle
negative_prompt: >-
  blurry blob, deformed animal, extra limbs, floating animal, pack of dogs,
  snow, night, cartoon, sticker, text, watermark, logo
edit_mask:
  mode: track_blob
  size_frac: 0.55
  aspect: 1.20
  y_lo: 0.52
  y_hi: 0.90
  blur_sigma: 1.2
  composite_blur: 0.6
prime:
  shape: dog
  color: [110, 90, 70]
prime_on_inpaint: false
strength: 0.96
annotation_classes:
  - dog
  - animal on railway track
  - railway track
  - train
  - sky
  - tree
