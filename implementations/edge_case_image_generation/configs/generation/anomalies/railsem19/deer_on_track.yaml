# Cab-view animal insert — placement is dynamic (depth + track corridor).
id: deer_on_track
dataset: railsem19
display_name: Deer on track
method: auto
prompt: >-
  photorealistic brown deer standing on railway trackbed facing the camera,
  wild animal on train tracks, clear four-legged animal, matching scene
  lighting and motion blur, same camera angle
negative_prompt: >-
  blurry blob, deformed animal, extra limbs, floating animal, herd,
  snow, night, cartoon, sticker, text, watermark, logo
edit_mask:
  mode: track_blob
  size_frac: 0.70
  aspect: 1.15
  y_lo: 0.50
  y_hi: 0.88
  blur_sigma: 1.2
  composite_blur: 0.6
prime:
  shape: deer
  color: [130, 85, 45]
prime_on_inpaint: false
strength: 0.96
annotation_classes:
  - deer
  - animal on railway track
  - railway track
  - train
  - sky
  - tree
