# RailSem19 — fallen branch across the near rails.
id: fallen_branch
dataset: railsem19
display_name: Fallen branch on rails
method: paste
prompt: >-
  photorealistic thick brown wooden branch lying across railway rails,
  fallen tree limb obstructing the track, bark texture, same camera angle
negative_prompt: >-
  blurry smear, floating wood, entire upright tree, snow, night, cartoon,
  text, watermark, logo
edit_mask:
  mode: strip
  y_start: 0.66
  y_end: 0.76
  x_margin: 0.30
  intersect_track: false
  blur_sigma: 1.5
  composite_blur: 1.2
prime:
  shape: branch
  mix: 0.88
  color: [95, 58, 32]
strength: 0.80
annotation_classes:
  - fallen tree
  - branch on railway track
  - railway track
  - train
  - sky
  - tree
