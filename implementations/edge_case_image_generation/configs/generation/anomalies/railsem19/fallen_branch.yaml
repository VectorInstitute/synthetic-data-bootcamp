# Cab-view debris insert — placement is dynamic (depth + track corridor).
id: fallen_branch
dataset: railsem19
display_name: Fallen branch on rails
method: auto
prompt: >-
  photorealistic thick brown wooden branch lying across railway rails,
  fallen tree limb obstructing the track, bark texture, matching scene
  lighting and motion blur, same camera angle
negative_prompt: >-
  blurry smear, orange glow, floating wood, entire upright tree, snow,
  night, cartoon, sticker, text, watermark, logo
edit_mask:
  mode: track_strip
  thickness_frac: 0.40
  span_frac: 1.55
  y_lo: 0.55
  y_hi: 0.88
  blur_sigma: 1.2
  composite_blur: 0.6
prime:
  shape: branch
  mix: 0.88
  color: [95, 58, 32]
prime_on_inpaint: false
strength: 0.96
annotation_classes:
  - fallen tree
  - branch on railway track
  - railway track
  - train
  - sky
  - tree
