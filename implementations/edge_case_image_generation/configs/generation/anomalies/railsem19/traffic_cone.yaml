# Cab-view object insert — placement is dynamic (depth + track corridor).
id: traffic_cone
dataset: railsem19
display_name: Traffic cone on track
# auto → generation.default_anomaly_method (paste on cpu, inpaint on gpu_l4)
method: auto
prompt: >-
  photorealistic bright orange traffic cone with white reflective stripe
  standing upright on railway ballast, safety cone on train tracks,
  matching scene lighting and motion blur, sharp details, same camera angle
negative_prompt: >-
  blurry blob, orange smear, no cone, deformed cone, floating cone,
  night, cartoon, sticker, plastic toy, text, watermark, logo, multiple cones
edit_mask:
  mode: track_blob
  # Relative size vs local track width — no per-image x/y coordinates.
  size_frac: 0.50
  aspect: 1.45
  y_lo: 0.52
  y_hi: 0.90
  blur_sigma: 1.2
  composite_blur: 0.6
prime:
  shape: cone
  mix: 0.9
  color: [255, 110, 30]
# Used only for method: paste (CPU). SDXL inpaint ignores this unless opted in.
prime_on_inpaint: false
strength: 0.96
annotation_classes:
  - traffic cone
  - railway track
  - train
  - sky
  - tree
