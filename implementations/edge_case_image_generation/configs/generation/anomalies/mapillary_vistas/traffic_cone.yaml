id: traffic_cone
dataset: mapillary_vistas
display_name: Traffic cone on road
method: auto
prompt: >-
  orange traffic cone with white stripe standing on the asphalt road,
  realistic plastic cone, natural shadow, photorealistic photo
negative_prompt: >-
  cartoon, toy, sticker, CGI, floating, blurry, watermark, text, logo,
  orange car, recolor, melted, deformed
edit_mask:
  mode: ellipse
  cx: 0.50
  cy: 0.72
  # Generous hole so the cone has room (tiny masks → smudges).
  rx: 0.11
  ry: 0.20
  prefer_near: false
  blur_sigma: 1.5
  dilate: 3
  recomposite: false
strength: 0.99
guidance_scale: 9.0
num_inference_steps: 40
controlnet_strength: 0.35
annotation_classes:
  - traffic cone
  - road
