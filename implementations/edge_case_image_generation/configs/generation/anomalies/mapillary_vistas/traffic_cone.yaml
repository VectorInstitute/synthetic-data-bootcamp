id: traffic_cone
dataset: mapillary_vistas
display_name: Traffic cone on road
method: auto
prompt: >-
  a weathered orange traffic cone with a faded white reflective stripe,
  standing on asphalt, matte dirty plastic, soft contact shadow on the road,
  photorealistic dashcam photo, matching sunlight and perspective
negative_prompt: >-
  cartoon, toy, sticker, plastic sheen, glowing, CGI, floating, blurry,
  watermark, text, logo, orange car, recolor, perfect studio product shot
edit_mask:
  mode: ellipse
  cx: 0.48
  cy: 0.78
  rx: 0.08
  ry: 0.16
  prefer_near: false
  blur_sigma: 3.0
  composite_blur: 2.5
  dilate: 2
strength: 0.90
guidance_scale: 7.5
controlnet_strength: 0.35
annotation_classes:
  - traffic cone
  - road
