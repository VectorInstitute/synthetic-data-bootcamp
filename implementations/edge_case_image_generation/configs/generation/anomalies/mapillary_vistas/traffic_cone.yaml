id: traffic_cone
dataset: mapillary_vistas
display_name: Traffic cone on road
method: auto
# Short object-first prompt — SD1.5 inpaint follows this better than long scene essays.
prompt: >-
  a bright orange traffic cone with a white reflective stripe,
  standing upright on the asphalt, photorealistic, sharp, natural shadow
negative_prompt: >-
  blurry, deformed, melted plastic, cartoon, sticker, floating, watermark, text,
  logo, orange car, recolor, lane paint smear
edit_mask:
  mode: ellipse
  cx: 0.48
  cy: 0.78
  rx: 0.08
  ry: 0.16
  prefer_near: false
  blur_sigma: 3.0
  composite_blur: 2.5
  dilate: 2
strength: 0.92
guidance_scale: 8.5
controlnet_strength: 0.35
annotation_classes:
  - traffic cone
  - road
