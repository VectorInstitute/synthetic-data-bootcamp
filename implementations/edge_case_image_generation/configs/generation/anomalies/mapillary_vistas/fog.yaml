id: fog
dataset: mapillary_vistas
display_name: Fog / haze over the scene
method: auto
# Global atmosphere — local inpaint is the honest fail case in Notebook 1.5.
prompt: >-
  the same photograph with light realistic fog and haze, soft mist in the distance,
  slightly reduced visibility, overcast damp air, photorealistic
negative_prompt: >-
  cartoon, sticker, watermark, text, logo, white paint blob, different cars,
  new buildings, night, heavy smoke, whiteout
edit_mask:
  # Intentionally local: inpaint only "fogs" a patch — that is the lesson.
  mode: ellipse
  cx: 0.50
  cy: 0.40
  rx: 0.32
  ry: 0.26
  prefer_near: false
  blur_sigma: 4.0
  composite_blur: 3.0
  dilate: 2
strength: 0.75
# Mild denoise so ControlNet / instruct keep the same cars and layout.
controlnet_strength: 0.38
guidance_scale: 6.0
annotation_classes:
  - fog
  - mist
  - road
