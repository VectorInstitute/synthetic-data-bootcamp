id: pothole
dataset: mapillary_vistas
display_name: Pothole on road
method: auto
prompt: >-
  photorealistic asphalt road with a clear deep pothole in the lane,
  broken pavement hole with rough edges and dark cavity, street-level dashcam view,
  same lighting and camera angle
negative_prompt: >-
  blurry, cartoon, painted overlay, sticker, watermark, text, logo, indoor,
  yellow lane paint smear, flat oval patch, different buildings, new city
edit_mask:
  mode: seg_intersection
  cx: 0.50
  cy: 0.75
  rx: 0.16
  ry: 0.12
  prefer_near: true
  prefer_near_quantile: 0.25
  min_mask_keep: 0.45
  blur_sigma: 1.8
  composite_blur: 0.9
  dilate: 4
strength: 0.96
controlnet_strength: 0.34
annotation_classes:
  - pothole
  - road
