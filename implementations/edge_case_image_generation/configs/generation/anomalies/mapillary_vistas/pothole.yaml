id: pothole
dataset: mapillary_vistas
display_name: Pothole on road
method: auto
prompt: >-
  a deep pothole in the asphalt road surface, broken pavement with rough edges
  and a dark cavity, photorealistic, natural lighting
negative_prompt: >-
  blurry, cartoon, painted oval, sticker, watermark, text, logo,
  yellow lane paint smear, puddle only, flat patch
edit_mask:
  mode: ellipse
  cx: 0.50
  cy: 0.76
  rx: 0.14
  ry: 0.10
  prefer_near: false
  blur_sigma: 3.0
  composite_blur: 2.5
  dilate: 2
strength: 0.90
guidance_scale: 8.0
controlnet_strength: 0.35
annotation_classes:
  - pothole
  - road
