id: road_debris
dataset: mapillary_vistas
display_name: Cardboard box / debris on road
method: auto
prompt: >-
  large brown cardboard shipping box on the asphalt road,
  open flaps, dusty cardboard, clear cast shadow, photorealistic photo
negative_prompt: >-
  blurry, cartoon, sticker, floating, watermark, text, logo, toy, CGI,
  invisible, empty road, no object
edit_mask:
  mode: ellipse
  cx: 0.50
  cy: 0.74
  rx: 0.16
  ry: 0.14
  prefer_near: false
  blur_sigma: 1.5
  dilate: 3
  recomposite: false
strength: 0.99
guidance_scale: 9.0
num_inference_steps: 40
controlnet_strength: 0.35
annotation_classes:
  - cardboard box
  - box
  - debris
  - road
