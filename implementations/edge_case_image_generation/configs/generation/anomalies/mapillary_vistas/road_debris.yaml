id: road_debris
dataset: mapillary_vistas
display_name: Cardboard box / debris on road
method: auto
prompt: >-
  a large brown cardboard shipping box sitting flat on the asphalt road surface,
  dusty cardboard with open flaps, contact shadow on the pavement, photorealistic
negative_prompt: >-
  blurry, cartoon, sticker, floating in air, watermark, text, logo, toy, CGI,
  levitating, empty road, no object, mid-air
edit_mask:
  # Dynamically anchor on ADE road pixels in the lower frame + nearer depth.
  mode: road_patch
  cx: 0.50
  cy: 0.78
  rx: 0.12
  ry: 0.10
  y_min: 0.55
  y_max: 0.92
  x_min: 0.28
  x_max: 0.72
  prefer_near: true
  blur_sigma: 1.2
  dilate: 2
  recomposite: false
strength: 1.0
guidance_scale: 9.0
num_inference_steps: 40
controlnet_strength: 0.42
annotation_classes:
  - cardboard box
  - box
  - debris
  - road
