id: traffic_cone
dataset: rdd2022
display_name: Traffic cone on road
method: auto
prompt: >-
  photorealistic bright orange traffic cone with white reflective stripe
  standing upright on asphalt road, safety cone in the driving lane,
  street-level camera, same lighting and weather
negative_prompt: >-
  blurry blob, orange smear, cartoon, sticker, floating cone, watermark, text, logo
edit_mask:
  mode: ellipse
  cx: 0.46
  cy: 0.72
  rx: 0.08
  ry: 0.14
  prefer_near: true
  blur_sigma: 1.2
  composite_blur: 0.7
strength: 0.80
annotation_classes:
  - traffic cone
  - road
