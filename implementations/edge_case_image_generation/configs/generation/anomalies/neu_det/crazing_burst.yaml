id: crazing_burst
dataset: neu_det
display_name: Crazing crack network
method: auto
prompt: >-
  photorealistic steel surface with fine crazing crack network, dense hairline
  cracks on metal, industrial defect inspection, same lighting
negative_prompt: >-
  blurry, cartoon, watermark, text, logo, painted graffiti
edit_mask:
  mode: ellipse
  cx: 0.48
  cy: 0.52
  rx: 0.30
  ry: 0.30
  blur_sigma: 1.5
  composite_blur: 0.9
strength: 0.78
annotation_classes:
  - crazing
  - steel surface
