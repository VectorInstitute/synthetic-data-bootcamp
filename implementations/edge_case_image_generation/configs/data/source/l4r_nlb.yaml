# @package data
name: l4r_nlb
label: "L4R_NLB — Nordlandsbanen (CC BY 3.0)"
license: "CC BY 3.0"
attribution: >-
  L4R_NLB dataset (HTW Berlin). Source footage: NRK Nordlandsbanen
  minute-by-minute. https://zenodo.org/records/14260575
zenodo_record: 14260575
zenodo_url: https://zenodo.org/records/14260575
github_url: https://github.com/railway-perception-htw-berlin/L4R_NLB
auto_download: true
# All walkthrough frames come from fall (~3.3 GB single ZIP on Zenodo).
required_season: fall
archive_dir: ${paths.l4r_archive_dir}
extract_dir: ${paths.l4r_extract_dir}
frames:
  - season: fall
    frame_id: nlb_fall_000001
    save_as: l4r_fall_000001.png
  - season: fall
    frame_id: nlb_fall_000038
    save_as: l4r_fall_000038.png
  - season: fall
    frame_id: nlb_fall_000039
    save_as: l4r_fall_000039.png
  - season: fall
    frame_id: nlb_fall_000040
    save_as: l4r_fall_000040.png
  - season: fall
    frame_id: nlb_fall_000041
    save_as: l4r_fall_000041.png
