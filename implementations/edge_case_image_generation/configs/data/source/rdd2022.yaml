# RDD2022 — multi-national road damage detection (CC BY-SA 4.0).
# Road photos everyone understands; damage (esp. potholes) is sparse / long-tail.
# Cite: Arya et al., RDD2022 / CRDDC'2022. GitHub: sekilab/RoadDamageDetector
#
# We pull the China_MotorBike subset (~183 MB) — ground-level, compact for demos.
name: rdd2022
label: "RDD2022 road damage (China_MotorBike subset)"
license: "CC BY-SA 4.0"
attribution: >-
  RDD2022 (CRDDC'2022). Classes: longitudinal crack (D00), transverse crack (D10),
  alligator crack (D20), pothole (D40). Potholes are the rare / high-severity edge case.
kind: voc_zip
archive_url: >-
  https://bigdatacup.s3.ap-northeast-1.amazonaws.com/2022/CRDDC2022/RDD2022/Country_Specific_Data_CRDDC2022/RDD2022_China_MotorBike.zip
archive_name: RDD2022_China_MotorBike.zip
extract_dirname: RDD2022_China_MotorBike
dataset_root: ${paths.rdd2022_dir}
images_glob: "**/train/images/*.[jJ][pP][gG]"
annotations_glob: "**/train/annotations/xmls/*.xml"
max_images: 8
# Prefer rare / severe classes first when sampling workshop frames.
prefer_classes:
  - D40
  - D20
  - D10
  - D00
class_map:
  D00: longitudinal_crack
  D10: transverse_crack
  D20: alligator_crack
  D40: pothole
classes:
  - longitudinal_crack
  - transverse_crack
  - alligator_crack
  - pothole
