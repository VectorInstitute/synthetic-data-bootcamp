# How images are loaded into paths.samples_dir (= data/<dataset_name>/samples).
name: _template
# kind: local | voc_zip | hf_rows | urls
kind: local
max_images: 8
stem_prefixes:
  - scene_
  - example_anomaly_
prefer_classes: []
classes:
  - example_anomaly
