id: traffic_cone
display_name: Traffic cone on road
annotation_classes:
  - traffic cone
  - road
edit_mask:
  mode: road_patch
  cx: 0.46
  cy: 0.78
  rx: 0.07
  ry: 0.12
  y_min: 0.55
  y_max: 0.94
  prefer_near: true
  blur_sigma: 1.2
  dilate: 2
prompt: >-
  bright orange traffic cone with white stripe standing on asphalt,
  natural contact shadow, photorealistic
negative_prompt: >-
  blurry blob, cartoon, sticker, floating cone, watermark, text, logo
strength: 1.0
methods:
  inpaint:
    prompt: null
  controlnet_dual:
    prompt: null
  instruct:
    prompt: >-
      Add one orange traffic cone with a white stripe on the road foreground,
      do not recolor the rest of the scene
