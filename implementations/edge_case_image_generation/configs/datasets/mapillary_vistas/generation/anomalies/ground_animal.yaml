id: ground_animal
display_name: Ground animal on road (optional)
annotation_classes:
  - animal
  - dog
  - deer
  - cat
  - road
edit_mask:
  mode: road_patch
  cx: 0.50
  cy: 0.72
  rx: 0.10
  ry: 0.14
  y_min: 0.50
  y_max: 0.90
  prefer_near: true
  blur_sigma: 1.5
  dilate: 2
  recomposite: false
prompt: >-
  one real brown-and-white dog standing on the asphalt in the foreground,
  visible fur texture and natural coat color, lit by the same daylight as the street,
  soft contact shadow on the road, photorealistic street photograph
negative_prompt: >-
  black silhouette, solid black animal, cutout, stencil, flat 2D sticker, mask,
  shadow puppet, cartoon, CGI, toy, floating, watermark, text, logo, blurry,
  melted, deformed, giant animal
strength: 0.95
methods:
  inpaint:
    prompt: null
    negative_prompt: null
  controlnet_dual:
    prompt: null
    negative_prompt: null
  instruct:
    # Avoid the word "silhouette" — Klein was painting flat black cutouts.
    prompt: >-
      Add one real dog with brown and white fur standing on the foreground road,
      natural coat colors and fur detail matching the daylight, soft contact shadow,
      photorealistic, do not make a black silhouette or sticker, keep cars buildings
      and the sky unchanged
