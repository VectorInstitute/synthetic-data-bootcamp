id: road_debris
display_name: Cardboard box / debris on road
annotation_classes:
  - cardboard box
  - shipping box
  - cardboard
  - box
  - debris
  - package
  - road
edit_mask:
  mode: road_patch
  cx: 0.50
  cy: 0.78
  rx: 0.12
  ry: 0.10
  y_min: 0.55
  y_max: 0.92
  x_min: 0.28
  x_max: 0.72
  prefer_near: true
  blur_sigma: 1.2
  dilate: 2
  recomposite: false
# Shared fallbacks; method blocks override when set.
prompt: >-
  a large brown cardboard shipping box sitting flat on the asphalt road surface,
  dusty cardboard with open flaps, contact shadow on the pavement, photorealistic
negative_prompt: >-
  blurry, cartoon, sticker, floating in air, watermark, text, logo, toy, CGI,
  levitating, empty road, no object, mid-air
strength: 1.0
guidance_scale: 9.0
controlnet_strength: 0.42
methods:
  inpaint:
    prompt: null
    negative_prompt: null
    strength: null
    guidance_scale: null
    padding_mask_crop: null
  controlnet_dual:
    prompt: null
    negative_prompt: null
    strength: null
  instruct:
    prompt: >-
      Add one large brown cardboard box sitting on the foreground road asphalt,
      keep every car building and the sky unchanged
    negative_prompt: null
