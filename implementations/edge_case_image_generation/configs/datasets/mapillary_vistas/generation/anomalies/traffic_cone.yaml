id: traffic_cone
display_name: Traffic cone on road
description: traffic cone on asphalt
annotation_classes:
  - traffic cone
  - orange cone
  - cone
  - road
edit_mask:
  mode: road_patch
  cx: 0.48
  cy: 0.80
  rx: 0.07
  ry: 0.11
  y_min: 0.58
  y_max: 0.94
  x_min: 0.30
  x_max: 0.70
  prefer_near: true
  blur_sigma: 1.2
  dilate: 2
  recomposite: false
# Pre-gen novelty: cartesian product is shuffled once, then cycled per attempt.
# 2×3×2×2×2 = 48 combos — short batches still cover all axes.
variations:
  size: [small, medium]
  color: [orange, yellow-orange, faded orange]
  stripe: [with a white reflective stripe, with no stripes]
  placement: [in the near foreground on the asphalt, mid-distance in the driving lane]
  scale_hint: [correctly scaled vs nearby cars, slightly shorter than a curb]
# Fallback static prompt when no template is used.
prompt: >-
  one small orange traffic cone with a white stripe standing upright on the asphalt,
  base resting on the road, natural contact shadow, photorealistic street photo
negative_prompt: >-
  cartoon, toy, sticker, CGI, floating in air, giant cone, blurry, watermark,
  text, logo, orange car, recolor, melted, deformed, mid-air
strength: 1.0
guidance_scale: 9.0
controlnet_strength: 0.42
methods:
  inpaint:
    prompt: null
    negative_prompt: null
  controlnet_dual:
    prompt: null
    negative_prompt: null
  instruct:
    prompt_template: >-
      Add one {size} {color} traffic cone {stripe} standing on the road
      {placement}, {scale_hint}, base resting on the pavement, natural contact
      shadow, photorealistic street photo. Do not recolor cars or buildings.
  vlm_generate:
    prompt_template: >-
      Add one {size} {color} traffic cone {stripe} standing upright on the asphalt
      {placement}, {scale_hint}, natural contact shadow, keep the rest of the
      street photo unchanged
