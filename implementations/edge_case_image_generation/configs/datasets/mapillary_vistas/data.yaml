# Data source + sampling (merged onto cfg.data).
name: mapillary_vistas
kind: local
# 0 = no cap when listing samples (Notebook 2 needs the full toy extract).
max_images: 0
stem_prefixes:
  - scene_
  - traffic_cone_
  - pothole_
  - road_debris_
  - fog_
  - ground_animal_
# Rare-class extract targets (Mapillary panoptic labels → stem prefix).
# Notebook 2 focuses on traffic_cone + pothole; bump counts in the notebook extract step.
extract_label_map:
  object--traffic-cone: traffic_cone
  object--pothole: pothole
extract_max_per_class: 55
extract_max_generic: 540
extract_thumb_max_side: 1280
prefer_classes:
  - traffic_cone
  - pothole
classes:
  - traffic_cone
  - pothole
  - road_debris
  - fog
  - ground_animal
hf_repo: candylion/mapillary-vistas-v2
hf_zip_name: mapillary-vistas-dataset_public_v2.0.zip
