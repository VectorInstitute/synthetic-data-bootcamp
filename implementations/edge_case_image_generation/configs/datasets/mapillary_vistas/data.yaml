# Data source + sampling (merged onto cfg.data).
name: mapillary_vistas
kind: local
# 0 = no cap when listing samples (Notebook 2 needs the full toy extract).
max_images: 0
stem_prefixes:
  - scene_
  - traffic_cone_
  - trash_bin_
  - pothole_
  - road_debris_
  - fog_
# Rare-class extract targets (Mapillary panoptic labels → stem prefix).
# Notebook 2/3 focus: traffic_cone + trash_bin (both have real GT labels).
# Mapillary key is ``object--trash-can`` (readable "Trash Can") → our tag ``trash_bin``.
# Re-extract after changing this map: scripts/extract_mapillary_toy.py --clean
extract_label_map:
  object--traffic-cone: traffic_cone
  object--trash-can: trash_bin
# Both extract_max_* counts are multiplied by ``scale`` in configs/config.yaml
# (0.2 → 11 per rare class + 200 scenes).
extract_max_per_class: 55
# Scenes double as NB2 synth seed pools (300 per class by default) + holdout;
# NB3 caps train backgrounds via MAX_SCENE_TRAIN (default 150) so OD isn't
# ~800 empty vs ~50 rare. Raising this tops up an existing extract in NB0.
extract_max_generic: 1000
extract_thumb_max_side: 1280
prefer_classes:
  - traffic_cone
  - trash_bin
classes:
  - traffic_cone
  - trash_bin
  - pothole
  - road_debris
  - fog
hf_repo: candylion/mapillary-vistas-v2
hf_zip_name: mapillary-vistas-dataset_public_v2.0.zip
