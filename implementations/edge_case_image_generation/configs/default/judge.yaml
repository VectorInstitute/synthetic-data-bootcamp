# @package judge
# VLM-as-judge for synthetic quality gating.
#
# Backends (swap freely — same JSON schema + accept/retry/reject gate):
#   api     — vision chat via Vector Institute proxy (default) or direct Gemini/OpenAI
#   qwen_vl — local Qwen2.5-VL (gpu_l4 / cpu friendly offline path)
#   clip    — lightweight CLIP heuristic fallback
backend: api
model_id: gemini-3-flash-preview
api_base_url: https://proxy.vectorinstitute.ai/v1
api_provider: null   # null → auto (vector_proxy when api_base_url is set)
api_key: null        # null → OPENAI_API_KEY from .env (see .env.example)
api_max_side: 1024

# Local Qwen settings (used when backend=qwen_vl)
torch_dtype: float32
max_new_tokens: 256
min_pixels: 200704
max_pixels: 401408
reject_margin: 2.0
threshold: 8.0
schema_hint: |
  Respond with ONLY a single JSON object (no markdown fences) using this schema:
  {
    "prompt_faithfulness": <number 0-10>,
    "physical_plausibility": <number 0-10>,
    "annotation_correctness": <number 0-10>,
    "edge_case_present": <true|false>,
    "overall": <number 0-10>,
    "rationale": "<one short sentence>"
  }
  Scoring guide:
  - prompt_faithfulness: does the image show what the prompt asked for
    (including object count — two cones when asked for one is not a 9)?
  - physical_plausibility: would this object/condition look real in this scene
    (perspective, lighting, contact with the ground/road)?
  - annotation_correctness: if auto-boxes are listed, do they match visible objects?
    If none are provided, score 5.
  - edge_case_present: true if the target rare condition is visible at all.
    Must be true whenever prompt_faithfulness ≥ 7. Never set false while
    claiming the object/condition is in the image.
  - overall: training-ready score. Use ≥8 only when you would keep this sample.
    Do not average away a missing edge-case. If the rare condition is missing,
    overall must be < 6 and edge_case_present false.
