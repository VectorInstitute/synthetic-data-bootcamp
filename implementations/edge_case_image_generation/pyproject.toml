[project]
name = "edgecase-synthesis"
version = "0.1.0"
description = "Bootcamp reference: synthetic edge-case generation pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.49",
    "datasets>=2.20",
    "accelerate>=0.34",
    "pillow>=10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "hydra-core>=1.3",
    "opencv-python-headless>=4.8",
    "ultralytics>=8.3",
    "huggingface-hub>=0.24",
    "diffusers>=0.39",
    "requests>=2.31",
    "ipykernel>=7.3.0",
    "clip",
]

[project.optional-dependencies]
notebooks = ["ipykernel>=6.29", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgecase_synthesis"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
