# Training example configuration
# Base data directory (can be overridden from command line)
diffusion_config:
  d_layers: [512, 1024, 1024, 1024, 1024, 512]
  dropout: 0.0
  num_timesteps: 2000
  model_type: mlp
  iterations: 20000
  batch_size: 4096
  lr: 0.0006
  gaussian_loss_type: mse
  weight_decay: 1e-05
  scheduler: cosine
  data_split_ratios: [0.99, 0.005, 0.005] # Train, Val, Test splits. Note: only train set is used in this pipeline.
  # Set to false to train a TabDDPM model, which models the discrete columns as categoricals with
  # the multinomial part of the diffusion model instead of merging them into the numerical columns.
  merge_categoricals_into_numerical: false

random_seed: 42