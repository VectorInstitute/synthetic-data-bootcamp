[project]
name = "aieng-synthetic-data"
version = "0.1.1"
description = ""
authors = [ {name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aieng-synthetic-data",
    "bleach==6.4.0",
    "filelock==3.32.0",
    "jupyter-server==2.20.0",
    "jupyterlab==4.5.9",
    "mistune==3.3.0",
    "msgpack==1.2.1",
    "nbconvert>=7.17.0",
    "pip>=26.1.2",
    "pygments>=2.20.0",
    "requests>=2.34.2",
    "setuptools==83.0.0",
    "soupsieve==2.8.4",
    "tornado==6.5.7",
    "urllib3>=2.7.0",
    "virtualenv==21.7.0",
]

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "mypy>=2.3.0",
    "nbqa>=1.9.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.22",
]
# Edge-case image generation reference (implementations/edge_case_image_generation).
# Sync from repo root: uv sync --dev --group edge-case-image-generation
edge-case-vlm = [
    "google-genai>=1.0",
    "openai>=1.40",
]
edge-case-image-generation = [
    "accelerate>=0.34",
    "clip",
    "datasets>=2.20",
    "diffusers>=0.39",
    "hydra-core>=1.3",
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "scipy>=1.11",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.49",
    "ultralytics>=8.3",
]

[tool.uv.workspace]
members = [
  "aieng-synthetic-data",
]

[tool.uv.sources]
aieng-synthetic-data = { workspace = true }
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[tool.mypy]
ignore_missing_imports = true
install_types = true
pretty = true
namespace_packages = true
explicit_package_bases = true
non_interactive = true
warn_unused_configs = true
allow_any_generics = false
allow_subclassing_any = false
allow_untyped_calls = false
allow_untyped_defs = false
allow_incomplete_defs = false
check_untyped_defs = true
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]
