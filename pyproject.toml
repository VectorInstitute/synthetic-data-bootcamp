[project]
name = "synthetic-data-bootcamp"
version = "0.1.1"
description = ""
authors = [ {name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aieng-synthetic-data",
    "bleach==6.4.0",
    "dotenv>=0.9.9",
    "filelock==3.32.0",
    "jupyter-server==2.20.0",
    "jupyterlab==4.5.10",
    "mistune==3.3.0",
    "msgpack==1.2.1",
    "nbconvert>=7.17.0",
    "pip>=26.1.2",
    "pydantic>=2.13.4",
    "pygments>=2.20.0",
    "requests>=2.34.2",
    "setuptools==83.0.0",
    "soupsieve==2.8.4",
    "tornado==6.5.7",
    "urllib3>=2.7.0",
    "virtualenv==21.7.0",
]

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "mypy>=2.3.0",
    "nbqa>=1.9.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.22",
]

synbench = [
    "typer>=0.12",
    "openai>=1.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
]

tabular-data = [
    "midst-toolkit",
]

[tool.uv.workspace]
members = [
  "aieng-synthetic-data",
]

[tool.uv.sources]
aieng-synthetic-data = { workspace = true }
midst-toolkit = { git = "https://github.com/VectorInstitute/midst-toolkit.git" }


[tool.mypy]
# Resolve aieng.* from the source tree; without this the installed distribution
# has no py.typed marker and every cross-module import degrades to Any.
mypy_path = "aieng-synthetic-data"
ignore_missing_imports = true
install_types = true
pretty = true
namespace_packages = true
explicit_package_bases = true
non_interactive = true
warn_unused_configs = true
allow_any_generics = false
allow_subclassing_any = false
allow_untyped_calls = false
allow_untyped_defs = false
allow_incomplete_defs = false
check_untyped_defs = true
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
# IPython.display ships unannotated callables; the rich-display helpers here
# are thin wrappers around them and cannot satisfy disallow_untyped_calls.
module = "aieng.syn_data.synbench.display"
disallow_untyped_calls = false

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]
