name: code checks
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - '**.py'
      - uv.lock
      - pyproject.toml
      - '**.ipynb'
  pull_request:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - '**.py'
      - uv.lock
      - pyproject.toml
      - '**.ipynb'

jobs:
  run-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          # Install a specific version of uv.
          version: "0.9.11"
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: ".python-version"

      - name: Install dependencies and check code
        run: |
          uv venv .venv
          source .venv/bin/activate
          # Include text-sft so pip-audit covers notebook 05 LoRA dependencies
          # (see scripts/setup.sh: uv sync --dev --group text-sft).
          uv sync --all-extras --dev --group text-sft
          pre-commit run --all-files

      - name: pip-audit (gh-action-pip-audit)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          virtual-environment: .venv/
          # GHSA-g75f-g53v-794x: bleach linkify(parse_email=True) ReDoS CPU exhaustion
          # bleach is a transitive dep via nbconvert (HTML sanitization); nbconvert does
          # not call linkify(parse_email=True) on untrusted input, so the vulnerable code
          # path is unreachable in this project. The bleach package is deprecated and no
          # fixed version will be released.
          # TODO: Remove this ignore once nbconvert migrates off bleach (e.g., to nh3).
          ignore-vulns: |
            GHSA-g75f-g53v-794x
