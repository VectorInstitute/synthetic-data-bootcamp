name: unit tests
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - .github/workflows/docs.yml
      - .github/workflows/unit_tests.yml
      - '**.py'
      - '**.ipynb'
      - uv.lock
      - pyproject.toml
      - '**.rst'
      - '**.md'
  pull_request:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - .github/workflows/docs.yml
      - .github/workflows/unit_tests.yml
      - '**.py'
      - '**.ipynb'
      - uv.lock
      - pyproject.toml
      - '**.rst'
      - '**.md'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          # Install a specific version of uv.
          version: "0.9.11"
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: ".python-version"

      - name: Detect sub-package changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            subpkg:
              - 'aieng-synthetic-data/aieng/synbench/**'

      - name: Install dependencies and run tests
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --all-extras --dev
          uv run --directory aieng-synthetic-data pytest -m "not integration_test" --ignore=tests/synbench tests

      - name: Install sub-package deps and run its tests
        if: steps.filter.outputs.subpkg == 'true'
        run: |
          source .venv/bin/activate
          uv sync --all-extras --dev --group synbench
          uv run --directory aieng-synthetic-data pytest -m "not integration_test" tests/synbench
